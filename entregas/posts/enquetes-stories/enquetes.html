<!doctype html><html lang=pt-BR><head><meta charset=utf-8><title>Enquetes para story</title><link rel="stylesheet" href="../2026-10-02-apresentacao/fontes.css"><style>:root{--m-azul:#1B3A8C; --m-azul-2:#152E70; --m-ouro:#E9C46A; --m-verm:#B5121B; --m-fundo:#F4F6FB; --m-tinta:#141B2D; --m-cinza:#4A5568; --m-branco:#FFFFFF; --m-linha:#DCE1EC;}body{margin:0;background:#D9DEE9}.enq{--bg:var(--m-azul);--fg:var(--m-branco);--ac:var(--m-ouro);--sub:rgba(255,255,255,.82);flex:none;width:1080px;aspect-ratio:9/16;container-type:inline-size;position:relative;overflow:hidden;background:var(--bg);color:var(--fg);font-family:Barlow,Arial,sans-serif}
.enq.claro{--bg:var(--m-fundo);--fg:var(--m-tinta);--ac:var(--m-verm);--sub:var(--m-cinza)}
.enq.verm{--bg:var(--m-verm);--fg:var(--m-branco);--ac:var(--m-ouro);--sub:rgba(255,255,255,.85)}
.enq.ouro{--bg:var(--m-ouro);--fg:var(--m-azul);--ac:var(--m-verm);--sub:#3A3320}
.enq .in{position:absolute;inset:0;padding:23cqw 8cqw 23cqw;display:flex;flex-direction:column;gap:5cqw}
.enq .brand{position:absolute;top:9cqw;left:8cqw;right:8cqw;display:flex;align-items:center;gap:3cqw;font-size:4cqw;font-weight:700;color:var(--fg)}
.enq .brand .sl{width:10cqw;height:10cqw;border-radius:50%;background:center/cover no-repeat var(--m-branco);flex:none}
.enq .eb{align-self:flex-start;font-size:4.4cqw;font-weight:700;letter-spacing:.06em;background:var(--ac);color:var(--bg);border-radius:99cqw;padding:1.6cqw 4cqw}
.enq.ouro .eb{color:var(--m-branco)}
.enq .t{font-family:"Barlow Condensed",Arial,sans-serif;font-weight:700;line-height:1.02;letter-spacing:-.01em;font-size:11cqw;color:var(--fg);text-wrap:balance}
.enq .box{background:var(--m-branco);color:var(--m-tinta);border-radius:3cqw;padding:5cqw;font-size:5cqw;line-height:1.35;border-left:2cqw solid var(--ac)}
.enq .num{font-family:"Barlow Condensed",Arial,sans-serif;font-weight:700;font-size:44cqw;line-height:.85;color:var(--ac);letter-spacing:-.02em}
.enq .sub{font-size:6cqw;line-height:1.25;color:var(--fg);font-weight:600}
.enq .aspas{font-family:"Barlow Condensed",Arial,sans-serif;font-weight:700;font-size:40cqw;line-height:.5;color:var(--ac);height:18cqw}
.enq.mito .t{font-size:13cqw}
.enq.pergunta .t,.enq.opiniao .t{font-size:14cqw}
.enq .zona{margin-top:auto;min-height:44cqw;display:grid;place-items:center}
.enq .stk{width:78cqw;background:var(--m-branco);color:var(--m-tinta);border-radius:4cqw;padding:4.5cqw;display:grid;gap:2.6cqw;text-align:center;box-shadow:0 2cqw 6cqw rgba(0,0,0,.25)}
.enq .stk .q{font-weight:700;font-size:4.6cqw;line-height:1.2}
.enq .stk .opt{border:.4cqw solid var(--m-linha);border-radius:3cqw;padding:2.6cqw;font-weight:700;font-size:4.6cqw;color:var(--m-azul)}
.enq.fundo .stk{visibility:hidden}
.enq .fonte{font-size:3.6cqw;line-height:1.3;color:var(--sub)}
.enq .resp-t{font-family:"Barlow Condensed",Arial,sans-serif;font-weight:700;font-size:20cqw;line-height:.95;color:var(--ac)}
.enq .resp-p{font-size:6.4cqw;line-height:1.35;color:var(--fg)}
.enq .cta{margin-top:auto;margin-bottom:2cqw;align-self:flex-start;background:var(--fg);color:var(--bg);border-radius:3cqw;padding:3cqw 5cqw;font-weight:700;font-size:5cqw}
</style></head><body><div class="par" id="e1"></div><div class="par" id="e2"></div><div class="par" id="e3"></div><div class="par" id="e4"></div><div class="par" id="e5"></div><div class="par" id="e6"></div><div class="par" id="e7"></div><div class="par" id="e8"></div><div class="par" id="e9"></div><div class="par" id="e10"></div><div class="par" id="e11"></div><div class="par" id="e12"></div><div class="par" id="e13"></div><div class="par" id="e14"></div><div class="par" id="e15"></div><div class="par" id="e16"></div><div class="par" id="e17"></div><div class="par" id="e18"></div><div class="par" id="e19"></div><div class="par" id="e20"></div><script>const D={enquetes:[{"id": 1, "layout": "lei", "cor": "azul", "eb": "Você sabia?", "box": "Art. 12: assistência material = alimentação, vestuário e instalações higiênicas.", "q": "A Lei de Execução Penal cita escova de dente?", "ops": ["Sim", "Não"], "certa": 1, "resp": "A lei fala em instalações higiênicas (art. 12) e em atendimento odontológico (art. 14). Escova de dente não aparece.", "fonte": "Lei de Execução Penal (Lei 7.210/1984), arts. 12 e 14", "quando": "10/10 (enquete do calendário)"}, {"id": 2, "layout": "lei", "cor": "claro", "eb": "Você sabia?", "box": "Art. 14: a assistência à saúde do preso compreende atendimento médico, farmacêutico e odontológico.", "q": "A lei prevê dentista para quem está preso?", "ops": ["Sim", "Não"], "certa": 0, "resp": "O art. 14 da LEP prevê atendimento médico, farmacêutico e odontológico, de caráter preventivo e curativo.", "fonte": "Lei de Execução Penal (Lei 7.210/1984), art. 14", "quando": "Véspera do Reel de 13/10"}, {"id": 3, "layout": "lei", "cor": "verm", "eb": "Você sabia?", "box": "Art. 13: locais destinados à venda de produtos e objetos permitidos e não fornecidos pela Administração.", "q": "A lei permite vender na prisão o que o Estado não fornece?", "ops": ["Sim", "Não"], "certa": 0, "resp": "O art. 13 da LEP prevê locais de venda de produtos permitidos que a Administração não fornece.", "fonte": "Lei de Execução Penal (Lei 7.210/1984), art. 13", "quando": "Semana de 13/10"}, {"id": 4, "layout": "lei", "cor": "ouro", "eb": "O Supremo", "box": "ADPF 347 (2023): o STF reconheceu violação massiva de direitos no sistema prisional, entre eles o direito à higiene.", "q": "O STF já reconheceu violação de direitos nas prisões?", "ops": ["Sim", "Não"], "certa": 0, "resp": "Em 2023, na ADPF 347, o STF reconheceu um cenário de violação massiva de direitos, citando higiene, saúde e alimentação.", "fonte": "STF, ADPF 347, julgada em 04/10/2023", "quando": "Véspera do carrossel de 20/10"}, {"id": 5, "layout": "mito", "cor": "verm", "eb": "Verdade ou mito?", "q": "Existe prisão perpétua no Brasil.", "ops": ["Verdade", "Mito"], "certa": 1, "resp": "A Constituição proíbe penas de caráter perpétuo (art. 5º, XLVII, b).", "fonte": "Constituição Federal, art. 5º, XLVII, b", "quando": "Semana de 20/10"}, {"id": 6, "layout": "mito", "cor": "azul", "eb": "Verdade ou mito?", "q": "Estudar na prisão pode diminuir a pena.", "ops": ["Verdade", "Mito"], "certa": 0, "resp": "A cada 12 horas de estudo, divididas em pelo menos 3 dias, desconta-se 1 dia de pena.", "fonte": "Lei de Execução Penal (Lei 7.210/1984), art. 126, § 1º, I", "quando": "Semana de 07/11"}, {"id": 7, "layout": "mito", "cor": "claro", "eb": "Verdade ou mito?", "q": "Trabalhar na prisão pode diminuir a pena.", "ops": ["Verdade", "Mito"], "certa": 0, "resp": "A cada 3 dias de trabalho, desconta-se 1 dia de pena.", "fonte": "Lei de Execução Penal (Lei 7.210/1984), art. 126, § 1º, II", "quando": "Semana de 07/11"}, {"id": 8, "layout": "mito", "cor": "ouro", "eb": "Verdade ou mito?", "q": "Reincidir é só voltar a ser preso.", "ops": ["Verdade", "Mito"], "certa": 1, "resp": "Pelo Código Penal, reincidir é cometer novo crime depois de uma condenação definitiva (art. 63).", "fonte": "Código Penal, art. 63", "quando": "Véspera do Reel de 11/10"}, {"id": 9, "layout": "dado", "cor": "azul", "eb": "Chute o número", "num": "?", "sub": "de cada 4 pessoas voltaram a ser condenadas em até 5 anos", "q": "Quantas, de cada 4?", "ops": ["1", "3"], "certa": 0, "rt": "Quase 1 em 4.", "resp": "24,4% voltaram a ser condenadas em até 5 anos, num estudo do Ipea para o CNJ em 5 estados.", "fonte": "Ipea/CNJ, 2015", "quando": "Semana de 09/10"}, {"id": 10, "layout": "dado", "cor": "claro", "eb": "Aqui em Maringá", "num": "960", "sub": "vagas na Casa de Custódia de Maringá", "q": "Quantas pessoas havia lá na inspeção?", "ops": ["Menos de 960", "Mais de 960"], "certa": 1, "rt": "1.198 pessoas.", "resp": "Para 960 vagas: cerca de 25% acima da capacidade, na inspeção de 21/03/2025.", "fonte": "Defensoria Pública do PR, 21/03/2025", "quando": "Véspera do carrossel de 20/10"}, {"id": 11, "layout": "dado", "cor": "verm", "eb": "Pena máxima", "num": "?", "sub": "anos é o limite de cumprimento de pena no Brasil", "q": "Qual é o limite?", "ops": ["30 anos", "40 anos"], "certa": 1, "rt": "40 anos.", "resp": "É o limite de cumprimento de pena previsto no Código Penal (art. 75).", "fonte": "Código Penal, art. 75", "quando": "Semana de 20/10"}, {"id": 12, "layout": "dado", "cor": "ouro", "eb": "Pesquisa", "num": "144", "sub": "estudos brasileiros sobre reincidência foram revisados", "q": "O apoio da família influencia a volta à prisão?", "ops": ["Sim", "Não"], "certa": 0, "rt": "Sim, está associado.", "resp": "Os estudos associam a falta de apoio da família a mais chances de voltar à prisão. É uma associação, não uma garantia.", "fonte": "Instituto Igarapé, 2022", "quando": "Véspera do Reel de 29/10"}, {"id": 13, "layout": "pergunta", "cor": "azul", "eb": "Em Maringá, 2025", "q": "O que faltava numa penitenciária de Maringá?", "ops": ["Itens de higiene", "Nada"], "certa": 0, "rt": "Itens de higiene.", "resp": "Pasta de dente, aparelho de barbear e escova, na inspeção de 13/05/2025 da Penitenciária Estadual de Maringá.", "fonte": "Defensoria Pública do PR, 13/05/2025", "quando": "Véspera do carrossel de 20/10"}, {"id": 14, "layout": "pergunta", "cor": "claro", "eb": "Quem paga a conta?", "q": "Quando falta escova e pasta, quem costuma cobrir?", "ops": ["O Estado", "A família"], "certa": 1, "rt": "A família.", "resp": "Numa unidade de Minas Gerais, quem estava preso dependia da família ou de instituições religiosas para ter escova e pasta.", "fonte": "PLOS ONE, 2025 (uma unidade de MG)", "quando": "Véspera do Reel de 29/10"}, {"id": 15, "layout": "pergunta", "cor": "verm", "eb": "Teste rápido", "q": "O que é reincidência?", "ops": ["Novo crime após condenação", "Ficar preso muito tempo"], "certa": 0, "rt": "Novo crime.", "resp": "É o que diz o Código Penal (art. 63): cometer novo crime depois de uma condenação definitiva.", "fonte": "Código Penal, art. 63", "quando": "Véspera do Reel de 11/10"}, {"id": 16, "layout": "pergunta", "cor": "ouro", "eb": "Teste rápido", "q": "Toda pena no Brasil tem fim?", "ops": ["Sim", "Não"], "certa": 0, "rt": "Sim.", "resp": "Não há prisão perpétua (Constituição, art. 5º) e o cumprimento tem limite de 40 anos (Código Penal, art. 75).", "fonte": "CF, art. 5º, XLVII, b; CP, art. 75", "quando": "Semana de 20/10"}, {"id": 17, "layout": "opiniao", "cor": "azul", "eb": "Sua opinião", "q": "O básico dentro da prisão afeta quem está fora?", "ops": ["Afeta", "Não afeta"], "certa": null, "resp": "Obrigado por votar! O efeito rebote é isso: quando falta o básico lá dentro, o custo volta para fora.", "fonte": "", "quando": "Qualquer dia"}, {"id": 18, "layout": "opiniao", "cor": "claro", "eb": "Você decide", "q": "Qual tema você quer no próximo post?", "ops": ["O que diz a lei", "Dados de Maringá"], "certa": null, "resp": "Anotado! O tema mais votado entra na pauta da semana.", "fonte": "", "quando": "Domingo, antes do encontro de segunda"}, {"id": 19, "layout": "opiniao", "cor": "verm", "eb": "Conta pra gente", "q": "Você já tinha ouvido falar em reincidência?", "ops": ["Já", "Nunca"], "certa": null, "resp": "Valeu! Na série do perfil function enq(e, modo){
  const marca = '<div class="brand"><i class="sl" style="background-image:var(--sl)"></i>efeitorebote.oficial</div>';
  let h = "";
  if (modo === "resp") {
    const certa = e.certa === null || e.certa === undefined ? null : e.ops[e.certa];
    const rt = e.rt || (certa ? certa + '.' : null);
    h = '<div class="eb">' + (rt ? 'Resposta' : 'Resultado') + '</div>' + (rt ? '<div class="resp-t">' + esc(rt) + '</div>' : '<div class="t">' + esc(e.q) + '</div>')
      + '<p class="resp-p">' + esc(e.resp) + '</p><div class="cta">Siga @efeitorebote.oficial</div>' + (e.fonte ? '<div class="fonte">Fonte: ' + esc(e.fonte) + '</div>' : '');
  } else {
    h = '<div class="eb">' + esc(e.eb) + '</div>';
    if (e.layout === "dado") h += '<div class="num">' + esc(e.num) + '</div><div class="sub">' + esc(e.sub) + '</div>';
    else if (e.layout === "lei") h += '<div class="t">' + esc(e.q) + '</div><div class="box">' + esc(e.box) + '</div>';
    else if (e.layout === "mito") h += '<div class="aspas" aria-hidden="true">“</div><div class="t">' + esc(e.q) + '</div>';
    else h += '<div class="t">' + esc(e.q) + '</div>';
    h += '<div class="zona"><div class="stk"><span class="q">' + esc(e.q) + '</span>' + e.ops.map(o => '<span class="opt">' + esc(o) + '</span>').join("") + '</div></div>' + (e.fonte ? '<div class="fonte">Fonte: ' + esc(e.fonte) + '</div>' : '');
  }
  return '<div class="enq ' + e.cor + ' ' + e.layout + (modo === "fundo" ? ' fundo' : '') + '" data-enq="' + e.id + '" data-modo="' + modo + '" role="img" aria-label="Enquete ' + e.id + ': ' + esc(e.q) + '">' + marca + '<div class="in">' + h + '</div></div>';
}
D.enquetes.forEach(e=>{document.getElementById('e'+e.id).innerHTML=enq(e,'fundo')+enq(e,'resp')});</script></body></html>
